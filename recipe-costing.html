<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Recipe Costing — AI Menu & Costing Assistant</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

.container {
    max-width: 900px;
    margin: auto;
}

.header {
    background: #222;
    color: white;
    padding: 25px;
    border-radius: 14px;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0 0 8px;
}

.header p {
    margin: 0;
    opacity: .75;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,.07);
}

label {
    display: block;
    font-weight: bold;
    margin-top: 12px;
}

input {
    width: 100%;
    padding: 11px;
    margin-top: 6px;
    margin-bottom: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
}

button {
    border: none;
    border-radius: 6px;
    padding: 11px 15px;
    cursor: pointer;
    font-size: 15px;
}

.add {
    background: #198754;
    color: white;
}

.calculate {
    width: 100%;
    background: #222;
    color: white;
    font-size: 17px;
    margin-top: 10px;
}

.delete {
    background: #dc3545;
    color: white;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin: 15px 0;
}

th, td {
    border: 1px solid #ddd;
    padding: 8px;
}

th {
    background: #eee;
}

.result {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.box {
    background: #f1f3f5;
    padding: 15px;
    border-radius: 8px;
}

.box small {
    display: block;
    color: #666;
    margin-bottom: 5px;
}

.box strong {
    font-size: 19px;
}

@media(max-width:600px) {
    .result {
        grid-template-columns: 1fr;
    }

    table {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🍳 Recipe Costing</h1>
        <p>AI Menu & Costing Assistant — V2</p>
    </div>

    <div class="card">

        <h2>Informasi Menu</h2>

        <label>Nama Menu</label>
        <input id="menu" placeholder="Contoh: Ayam Lada Hitam">

        <label>Jumlah Porsi / Yield</label>
        <input id="yield" type="number" placeholder="Contoh: 100">

        <label>Target Food Cost (%)</label>
        <input id="foodCost" type="number" value="40">

    </div>

    <div class="card">

        <h2>Daftar Bahan</h2>

        <table>

            <thead>
                <tr>
                    <th>Bahan</th>
                    <th>Qty (kg)</th>
                    <th>Harga/kg</th>
                    <th>Cost</th>
                    <th></th>
                </tr>
            </thead>

            <tbody id="ingredients"></tbody>

        </table>

        <button class="add" onclick="addIngredient()">
            + Tambah Bahan
        </button>

    </div>

    <div class="card">

        <button class="calculate" onclick="calculate()">
            🧮 HITUNG RECIPE COSTING
        </button>

    </div>

    <div class="card">

        <h2>Hasil Costing</h2>

        <div class="result">

            <div class="box">
                <small>Menu</small>
                <strong id="resultMenu">-</strong>
            </div>

            <div class="box">
                <small>Total Recipe Cost</small>
                <strong id="totalCost">Rp 0</strong>
            </div>

            <div class="box">
                <small>HPP / Porsi</small>
                <strong id="hpp">Rp 0</strong>
            </div>

            <div class="box">
                <small>Food Cost</small>
                <strong id="resultFoodCost">0%</strong>
            </div>

            <div class="box">
                <small>Harga Jual</small>
                <strong id="sellingPrice">Rp 0</strong>
            </div>

            <div class="box">
                <small>Gross Profit / Porsi</small>
                <strong id="profit">Rp 0</strong>
            </div>

        </div>

    </div>

</div>

<script>

let ingredients = [];


function addIngredient() {

    ingredients.push({
        name: "",
        qty: 0,
        price: 0
    });

    render();

}


function removeIngredient(index) {

    ingredients.splice(index, 1);

    render();

}


function updateName(index, value) {

    ingredients[index].name = value;

}


function updateQty(index, value) {

    ingredients[index].qty = Number(value);

    render();

}


function updatePrice(index, value) {

    ingredients[index].price = Number(value);

    render();

}


function render() {

    const table =
        document.getElementById("ingredients");

    table.innerHTML = "";

    ingredients.forEach(function(item, index) {

        const cost =
            item.qty * item.price;

        const row =
            document.createElement("tr");

        row.innerHTML = `

            <td>
                <input
                    value="${item.name}"
                    placeholder="Contoh: Ayam"
                    onchange="updateName(${index}, this.value)"
                >
            </td>

            <td>
                <input
                    type="number"
                    step="0.001"
                    value="${item.qty}"
                    onchange="updateQty(${index}, this.value)"
                >
            </td>

            <td>
                <input
                    type="number"
                    value="${item.price}"
                    onchange="updatePrice(${index}, this.value)"
                >
            </td>

            <td>
                <strong>${rupiah(cost)}</strong>
            </td>

            <td>
                <button
                    class="delete"
                    onclick="removeIngredient(${index})">
                    ×
                </button>
            </td>

        `;

        table.appendChild(row);

    });

}


function calculate() {

    const menu =
        document.getElementById("menu").value;

    const yieldAmount =
        Number(document.getElementById("yield").value);

    const target =
        Number(document.getElementById("foodCost").value);


    if (!menu) {
        alert("Masukkan nama menu.");
        return;
    }

    if (!yieldAmount || yieldAmount <= 0) {
        alert("Masukkan jumlah porsi.");
        return;
    }

    if (!target || target <= 0) {
        alert("Masukkan Food Cost.");
        return;
    }


    let total = 0;


    ingredients.forEach(function(item) {

        total +=
            item.qty * item.price;

    });


    const hpp =
        total / yieldAmount;


    const selling =
        hpp / (target / 100);


    const profit =
        selling - hpp;


    document.getElementById("resultMenu")
        .innerText = menu;

    document.getElementById("totalCost")
        .innerText = rupiah(total);

    document.getElementById("hpp")
        .innerText = rupiah(hpp);

    document.getElementById("resultFoodCost")
        .innerText = target + "%";

    document.getElementById("sellingPrice")
        .innerText = rupiah(selling);

    document.getElementById("profit")
        .innerText = rupiah(profit);

}


function rupiah(number) {

    return "Rp " +
        Math.round(number)
        .toLocaleString("id-ID");

}


// Buat 3 baris bahan saat pertama dibuka

addIngredient();
addIngredient();
addIngredient();

</script>

</body>
<a href="recipe-costing.html">Recipe Costing</a>
</html>
