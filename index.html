<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1F44">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ChefPlan Pro</title>
<style>
:root{--navy:#0B2A5B;--blue:#1565D8;--gold:#F5A623;--bg:#F3F6FB;--card:#fff;--line:#E1E7F0;--tx:#13233F;--mut:#64748B;--ok:#1E9E5A;--warn:#D98A00;--bad:#D93636}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:var(--bg);font-size:15px}
button,input,select{font:inherit}
#splash{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;z-index:50}
#splash h1{margin:10px 0 4px;font-size:34px;color:var(--navy)}#splash h1 b{color:var(--gold)}
#splash p{margin:0 0 26px;color:var(--mut)}
#splash img{width:min(80vw,340px);height:auto}.by{margin:4px 0 24px;font-size:12px;font-style:italic;color:var(--mut);letter-spacing:.3px}.by b{color:var(--navy);font-style:normal}
#app{display:none;height:100%;flex-direction:column}
header{background:linear-gradient(90deg,var(--navy),var(--blue));color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
header h2{margin:0;font-size:18px;flex:1}
header button{background:none;border:0;color:#fff;font-size:22px;width:40px;height:40px}
main{flex:1;overflow-y:auto;padding:14px 14px 90px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;border:0;background:none;padding:8px 0 6px;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:20px}nav button.on{color:var(--blue);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(11,42,91,.06)}
.card h3{margin:0 0 8px;font-size:15px;color:var(--navy)}
.hero{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border:0}.hero h3{color:#fff}
.bar{height:8px;background:rgba(255,255,255,.25);border-radius:6px;overflow:hidden;margin:10px 0 4px}.bar i{display:block;height:100%;background:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;font-weight:600;color:var(--navy);box-shadow:0 2px 8px rgba(11,42,91,.06)}.tile i{display:block;font-style:normal;font-size:26px;margin-bottom:4px}
.btn{display:block;width:100%;min-height:46px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;margin-top:8px;padding:10px}
.btn.alt{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}.btn.gold{background:var(--gold);color:#3b2600}.btn.bad{background:var(--bad)}
.btn.sm{display:inline-block;width:auto;min-height:38px;padding:6px 12px;margin:4px 4px 0 0}.btn:disabled{opacity:.5}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px;font-weight:600}
input,select{width:100%;min-height:44px;border:1px solid #CBD5E4;border-radius:10px;padding:8px 10px;background:#fff;color:var(--tx)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;color:#fff;background:var(--mut)}
.b-VALID{background:var(--ok)}.b-PERINGATAN{background:var(--warn)}.b-TIDAK{background:var(--bad)}
.hero .badge{border:1px solid rgba(255,255,255,.6)}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px;font-weight:600;color:var(--mut)}.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:12.5px}
th{background:var(--blue);color:#fff;padding:8px 6px;text-align:left;position:sticky;top:0}
td{border-top:1px solid var(--line);padding:7px 6px;vertical-align:top}tr.sun td{background:#FFF2B3}tr.tap{cursor:pointer}
td.d{white-space:nowrap;font-weight:700;color:var(--navy)}td.d small{display:block;color:var(--mut);font-weight:500}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--mut)}.dot.VALID{background:var(--ok)}.dot.PERINGATAN{background:var(--warn)}.dot.TIDAK{background:var(--bad)}
.it{display:block;line-height:1.35}
.empty{text-align:center;color:var(--mut);padding:26px 10px}.empty b{display:block;color:var(--navy);margin-bottom:6px;font-size:16px}
.list li{margin:4px 0}ul.list{padding-left:18px;margin:6px 0}
#sheetBg{position:fixed;inset:0;background:rgba(10,20,40,.5);display:none;z-index:40;align-items:flex-end}
#sheet{background:#fff;width:100%;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
#sheet .x{float:right;border:0;background:none;font-size:24px;color:var(--mut)}
#load{position:fixed;inset:0;background:rgba(255,255,255,.75);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:60;color:var(--navy);font-weight:600}
.sp{width:42px;height:42px;border:5px solid #CFE0FA;border-top-color:var(--blue);border-radius:50%;animation:r 1s linear infinite;margin-bottom:10px}@keyframes r{to{transform:rotate(360deg)}}
#toast{position:fixed;left:14px;right:14px;bottom:calc(76px + env(safe-area-inset-bottom));background:var(--navy);color:#fff;padding:12px 14px;border-radius:12px;display:none;z-index:70;font-size:14px}#toast.err{background:var(--bad)}#toast.ok{background:var(--ok)}
.meal{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}.meal h4{margin:0 0 4px;color:var(--navy)}
.menuitem{display:flex;gap:10px;align-items:center;padding:12px 4px;border-top:1px solid var(--line)}.menuitem:first-child{border-top:0}.menuitem i{font-style:normal;font-size:22px}.menuitem small{display:block;color:var(--mut)}
</style>
</head>
<body>

<div id="splash">
  <img id="logoImg" alt="ChefPlan Pro — Plan Smart. Cook Better. Lead Stronger." width="520" height="486">
  <div class="by">by <b>Chef Berto Leumara</b></div>
  <button class="btn" style="max-width:320px" id="btnMulai">Mulai</button>
  <button class="btn alt" style="max-width:320px" id="btnSet">Pengaturan</button>
  <p style="margin-top:22px;font-size:12px">Versi 1.0.0</p>
</div>

<div id="app">
  <header><button id="hl" aria-label="Menu">☰</button><h2 id="title">ChefPlan Pro</h2></header>
  <main id="view"></main>
  <nav id="nav">
    <button data-p="beranda"><i>🏠</i>Beranda</button>
    <button data-p="rotasi"><i>🗓️</i>Rotasi</button>
    <button data-p="resep"><i>📖</i>Resep</button>
    <button data-p="bahan"><i>🧾</i>Bahan</button>
    <button data-p="lainnya"><i>⋯</i>Lainnya</button>
  </nav>
</div>

<div id="sheetBg"><div id="sheet"></div></div>
<div id="load"><div class="sp"></div><span id="loadMsg">Memuat...</span></div>
<div id="toast"></div>

<script>
/* ===== Inti aplikasi (dipakai juga oleh Halaman2.html) ===== */
var $ = function (s, e) { return (e || document).querySelector(s); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
var BLN_F = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
var rp = function (n) { return 'Rp ' + Math.round(Number(n) || 0).toLocaleString('id-ID'); };
var fmtD = function (t) { var a = String(t).split('-'); return a[2] + ' ' + BLN[+a[1] - 1] + ' ' + a[0]; };
var S = { cid: null, cycle: null, data: null, menu: null, stack: [], cur: null, mode: 'tabel' };
var PAGES = {};
var TABS = ['beranda', 'rotasi', 'resep', 'bahan', 'lainnya'];

function call(action, payload) {
  return new Promise(function (res, rej) {
    if (!window.google || !google.script || !google.script.run) return rej(new Error('Buka aplikasi lewat tautan Web App dari Apps Script.'));
    google.script.run
      .withSuccessHandler(function (r) { r && r.ok ? res(r.data) : rej(new Error(r ? r.error : 'Tidak ada respons dari server.')); })
      .withFailureHandler(function (e) { rej(new Error((e && e.message) || 'Koneksi gagal. Periksa internet Anda.')); })
      .api(action, payload || {});
  });
}
function showLoad(m) { $('#loadMsg').textContent = m || 'Memuat...'; $('#load').style.display = 'flex'; }
function hideLoad() { $('#load').style.display = 'none'; }
function toast(m, t) { var e = $('#toast'); e.textContent = m; e.className = t || ''; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { e.style.display = 'none'; }, t === 'err' ? 6000 : 3000); }
async function run(fn, msg) { showLoad(msg); try { return await fn(); } catch (e) { toast(e.message, 'err'); } finally { hideLoad(); } }
function openSheet(h) { $('#sheet').innerHTML = '<button class="x" onclick="closeSheet()">×</button>' + h; $('#sheetBg').style.display = 'flex'; }
function closeSheet() { $('#sheetBg').style.display = 'none'; }
$('#sheetBg').addEventListener('click', function (e) { if (e.target.id === 'sheetBg') closeSheet(); });
function confirmBox(msg) {
  return new Promise(function (res) {
    openSheet('<h3>Konfirmasi</h3><p>' + esc(msg) + '</p><button class="btn" id="cOk">Ya, lanjutkan</button><button class="btn alt" id="cNo">Batal</button>');
    $('#cOk').onclick = function () { closeSheet(); res(true); };
    $('#cNo').onclick = function () { closeSheet(); res(false); };
  });
}
function badge(st) { var k = st === 'TIDAK VALID' ? 'TIDAK' : st; return '<span class="badge b-' + esc(k) + '">' + esc(st === 'BELUM' ? 'Belum divalidasi' : st) + '</span>'; }
function empty(t, s, btn) { return '<div class="card empty"><b>' + esc(t) + '</b>' + esc(s) + (btn || '') + '</div>'; }
function today() { return new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10); }

async function go(name, arg, noPush) {
  if (!noPush && S.cur && S.cur !== name) S.stack.push(S.cur);
  S.cur = name;
  var pg = PAGES[name], v = $('#view');
  var tab = pg && pg.tab ? pg.tab : name;
  document.querySelectorAll('#nav button').forEach(function (b) { b.classList.toggle('on', b.dataset.p === tab); });
  $('#title').textContent = pg ? pg.title : 'ChefPlan Pro';
  $('#hl').textContent = TABS.indexOf(name) >= 0 ? '☰' : '←';
  v.scrollTop = 0;
  if (!pg) { v.innerHTML = empty('Halaman belum dipasang', 'Halaman ini ada di file Halaman2.html. Pasang file tersebut lalu muat ulang aplikasi.'); return; }
  v.innerHTML = '<div class="empty">Memuat...</div>';
  try { await pg.render(v, arg); } catch (e) { v.innerHTML = empty('Terjadi kesalahan', e.message); }
}
function back() { var p = S.stack.pop(); go(p || 'beranda', null, true); }

/* ===== Beranda ===== */
PAGES.beranda = { title: 'ChefPlan Pro', async render(v) {
  var d = await call('getDashboard'), c = d.siklusAktif, h = '';

function tglPlus(t, n) { var a = String(t).split('-'); return new Date(Date.UTC(+a[0], +a[1] - 1, +a[2] + n)).toISOString().slice(0, 10); }
function opsiMinggu(c) {
  var n = Math.ceil(Number(c.Durasi_Hari) / 7), o = [];
  for (var k = 1; k <= n; k++) o.push([k, 'Minggu ' + k + ' (' + fmtD(tglPlus(c.Tgl_Mulai, (k - 1) * 7)) + ' – ' + fmtD(tglPlus(c.Tgl_Mulai, Math.min(k * 7, Number(c.Durasi_Hari)) - 1)) + ')']);
  return o;
}
function akhirSiklus(c) { return tglPlus(c.Tgl_Mulai, Number(c.Durasi_Hari) - 1); }
function akhir3Hari(c, mulai) { var e = tglPlus(mulai, 2), a = akhirSiklus(c); return e > a ? a : e; }
function awal3Hari(c) { var t = today(); return t >= String(c.Tgl_Mulai) && t <= akhirSiklus(c) ? t : String(c.Tgl_Mulai); }
function opsi3Hari(c) {
  var o = [];
  for (var k = 0; k < Number(c.Durasi_Hari); k++) { var a = tglPlus(c.Tgl_Mulai, k); o.push([a, '3 hari: ' + fmtD(a) + ' – ' + fmtD(akhir3Hari(c, a))]); }
  return o;
}

async function hapusRotasi(c) {
  if (c.Status === 'Disetujui') return toast('Siklus sudah Disetujui. Ketuk Buka Kunci Menu di Generator dulu.', 'err');
  if (!(await confirmBox('Hapus rotasi "' + c.Nama + '" beserta seluruh menunya? Setelah itu Anda bisa membuat rotasi baru. Tindakan ini tidak bisa dibatalkan.'))) return;
  var r = await run(function () { return call('hapusSiklus', { ID_Siklus: c.ID_Siklus }); }, 'Menghapus rotasi...');
  if (r) { S.cid = null; S.cycle = null; S.data = null; toast('Rotasi "' + r.Nama + '" dihapus. Silakan buat rotasi baru.', 'ok'); go('generator', null, true); }
}

  }

  }).join('') + '</div><div class="kattot">Total ' + d.jumlahMenuAktif + ' menu aktif · ' + d.jumlahBahan + ' bahan baku</div></div>';

<script>
/* ===== LAPISAN PWA: koneksi ke Apps Script lewat internet (fetch + token), instalasi, dan mode offline ===== */
(function () {
  var KEY = 'chefplan_koneksi';
  function cfg() { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } }
  function simpan(c) { try { localStorage.setItem(KEY, JSON.stringify(c)); } catch (e) { } }
  function kirim(c, action, payload) {
    return fetch(c.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: c.token, action: action, payload: payload || {} }) })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (r) { return r; }, function () {
        throw new Error(navigator.onLine ? 'Tidak bisa terhubung ke database. Periksa URL Web App dan akses "Siapa saja".' : 'Tidak ada internet. Periksa sinyal HP Anda.');
      });
  }
  window.call = function (action, payload) {
    var c = cfg();
    if (!c) { setTimeout(bukaKoneksi, 50); return Promise.reject(new Error('Hubungkan aplikasi ke database terlebih dulu.')); }
    return kirim(c, action, payload).then(function (r) {
      if (r && r.ok) return r.data;
      if (r && /Token/i.test(r.error || '')) setTimeout(function () { bukaKoneksi('Token ditolak server. Periksa lagi.'); }, 50);
      throw new Error(r ? r.error : 'Tidak ada respons dari server.');
    });
  };
  window.bukaKoneksi = function (pesan) {
    var c = cfg() || {};
    openSheet('<h3>Hubungkan ke Database</h3>' + (pesan ? '<p style="color:var(--bad)">' + esc(pesan) + '</p>' : '') +
      '<p style="font-size:13px;color:var(--mut)">Isi sekali saja. Data tetap tersimpan di Google Sheets Anda.</p>' +
      fld('k_url', 'URL Web App Apps Script (berakhiran /exec)', c.url || '', 'url', 'placeholder="https://script.google.com/macros/s/.../exec"') +
      fld('k_tok', 'Token API (dari fungsi buatTokenApi)', c.token || '') +
      '<button class="btn" id="kSave">Uji dan Simpan</button><div id="kInfo" style="margin-top:8px;font-size:13px"></div>');
    $('#kSave').onclick = function () {
      var baru = { url: gv('k_url').trim(), token: gv('k_tok').trim() };
      if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(baru.url)) { $('#kInfo').innerHTML = '<span style="color:var(--bad)">URL harus diawali https://script.google.com/macros/s/ dan berakhiran /exec</span>'; return; }
      if (baru.token.length < 10) { $('#kInfo').innerHTML = '<span style="color:var(--bad)">Token belum diisi dengan benar.</span>'; return; }
      $('#kInfo').textContent = 'Menguji koneksi...';
      kirim(baru, 'getDashboard', {}).then(function (r) {
        if (r && r.ok) { simpan(baru); closeSheet(); toast('Terhubung ke database ✅', 'ok'); S.stack = []; go(S.cur && S.cur !== 'pengaturan' ? S.cur : 'beranda', null, true); }
        else $('#kInfo').innerHTML = '<span style="color:var(--bad)">' + esc(r && r.error ? r.error : 'Gagal') + '</span>';
      }, function (e) { $('#kInfo').innerHTML = '<span style="color:var(--bad)">' + esc(e.message) + '</span>'; });
    };
  };
  /* Pengaturan: kartu koneksi */
  var asliSet = PAGES.pengaturan.render;
  PAGES.pengaturan.render = async function (v) {
    if (!cfg()) { v.innerHTML = '<div class="card"><h3>Koneksi Database</h3><p>Aplikasi belum terhubung ke database.</p><button class="btn" onclick="bukaKoneksi()">Hubungkan Sekarang</button></div>'; return; }
    await asliSet(v);
    v.insertAdjacentHTML('afterbegin', '<div class="card"><h3>Koneksi Database</h3><p style="font-size:13px;color:var(--mut);word-break:break-all">Terhubung ke: ' + esc(cfg().url.slice(0, 60)) + '…</p><button class="btn alt" onclick="bukaKoneksi()">Ubah Koneksi</button></div>');
  };
  /* Tombol instal ke HP */
  var tunda = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); tunda = e;
    if (!$('#btnInstal')) {
      var b = document.createElement('button'); b.id = 'btnInstal'; b.className = 'btn alt'; b.style.maxWidth = '320px'; b.textContent = '📲 Instal ke HP';
      b.onclick = function () { tunda.prompt(); tunda.userChoice.then(function () { b.remove(); tunda = null; }); };
      $('#btnSet').insertAdjacentElement('afterend', b);
    }
  });
  window.addEventListener('appinstalled', function () { var b = $('#btnInstal'); if (b) b.remove(); toast('ChefPlan Pro terpasang di HP ✅', 'ok'); });
  window.addEventListener('offline', function () { toast('Koneksi internet terputus.', 'err'); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { });
  if (!cfg()) $('#btnMulai').addEventListener('click', function () { setTimeout(function () { if (!cfg()) bukaKoneksi(); }, 300); });
})();
</script>
